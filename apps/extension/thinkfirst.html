<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Think first</title><link rel="stylesheet" href="./src/ui.css" /></head>
  <body>
    <div class="wrap" style="max-width: 640px; margin: 6vh auto">
      <h1>Before you ask <span id="site"></span>…</h1>
      <p class="muted">Write your own attempt first. Even a rough one changes what you learn from the answer.</p>
      <div class="card">
        <textarea id="attempt" rows="7" placeholder="What do you think the answer is? What have you tried? Where exactly are you stuck?"></textarea>
        <div class="row" style="margin-top: 8px"><span class="faint">Stays on this page — nothing you write here is saved or sent.</span><span class="big" id="timer">2:00</span></div>
      </div>
      <div class="card">
        <strong>Non-AI tools</strong>
        <p id="tools" style="display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0"></p>
      </div>
      <p class="row"><span class="faint">You can always continue — this is a nudge, not a block.</span><button id="continue">Continue to the site</button></p>
    </div>
    <script type="module" src="./src/thinkfirst.ts"></script>
  </body>
</html>
