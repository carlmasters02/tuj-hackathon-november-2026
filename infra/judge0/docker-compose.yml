# Self-hosted Judge0 CE (primary CodeRunner when CODE_RUNNER=judge0).
# Based on the official judge0 v1.13.1 compose. Host requirements (see README):
#   - cgroup v1 (Judge0's isolate sandbox does not support cgroup v2 — on Fedora / Ubuntu 22.04+
#     add `systemd.unified_cgroup_hierarchy=0` to the kernel command line and reboot)
#   - privileged containers
# The API is bound to 127.0.0.1 and protected with AUTHN_TOKEN; never expose it publicly.
x-logging: &default-logging
  logging:
    driver: json-file
    options: { max-size: 100M }

services:
  server:
    image: judge0/judge0:1.13.1
    volumes: ["./judge0.conf:/judge0.conf:ro"]
    ports: ["127.0.0.1:2358:2358"]
    privileged: true
    <<: *default-logging
    restart: always
  worker:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes: ["./judge0.conf:/judge0.conf:ro"]
    privileged: true
    <<: *default-logging
    restart: always
  db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes: ["judge0-db:/var/lib/postgresql/data/"]
    <<: *default-logging
    restart: always
  redis:
    image: redis:7.2.4
    command: ["bash", "-c", 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"']
    env_file: judge0.conf
    <<: *default-logging
    restart: always
volumes:
  judge0-db:
